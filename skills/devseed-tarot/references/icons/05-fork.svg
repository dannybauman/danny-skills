<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
      .p2 { animation-delay: 3s; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.2); opacity: 1; } }
    }
  </style>
