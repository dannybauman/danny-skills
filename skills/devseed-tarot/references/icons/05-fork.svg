  <path d="M 80 100 Q 84 74 102 56 Q 106 52 108 46" stroke="#CF3F02" stroke-width="3"/>
  <path d="M 74 56 Q 77 48 84 50 Q 90 52 88 60 Q 86 67 77 65 Q 71 63 74 56 Z" fill="#9a9490" opacity="0.5"/>
  <g class="pulse">
    <circle cx="52" cy="40" r="5.5" stroke="#CF3F02" stroke-width="2.5"/>
