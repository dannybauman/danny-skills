<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Name</title>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      color: #1c1814;
    }
    .placeholder {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .placeholder h1 { margin-top: 0; }
    .placeholder code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: ui-monospace, Menlo, monospace;
    }
    .error {
      background: #fee;
      border: 1px solid #c33;
      padding: 16px;
      border-radius: 4px;
      color: #900;
    }
  </style>
</head>
<body>
  <div id="root">Loading…</div>

  <script>
    // Data file content gets injected here by HtmlService template.
    // For a .js file with `const X = [...]` etc., this declares globals.
    <?!= dataContent ?>

    function render() {
      const root = document.getElementById('root');
      while (root.firstChild) root.removeChild(root.firstChild);

      if (window.DATA_LOAD_ERROR) {
        const errBox = document.createElement('div');
        errBox.className = 'error';
        const label = document.createElement('strong');
        label.textContent = 'Failed to load data: ';
        errBox.appendChild(label);
        errBox.appendChild(document.createTextNode(window.DATA_LOAD_ERROR));
        root.appendChild(errBox);
        return;
      }

      // Default placeholder render. Replace this with your tool's actual rendering.
      // See README.md Step 5 for porting an existing static HTML tool.
      const box = document.createElement('div');
      box.className = 'placeholder';
      const h = document.createElement('h1');
      h.textContent = 'Tool Name';
      box.appendChild(h);
      const p = document.createElement('p');
      p.textContent = 'Starter loaded. Replace the render() function in Index.html with your tool’s actual rendering. Globals from your data file are now defined and ready to use.';
      box.appendChild(p);
      root.appendChild(box);
    }

    render();
  </script>
</body>
</html>
